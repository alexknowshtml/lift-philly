<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#141414;color:#eee;display:flex;height:100vh;overflow:hidden}
.sidebar{width:370px;min-width:320px;background:#1e1e1e;border-right:1px solid #2e2e2e;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.preview-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#0f0f0f}
h1{font-size:17px;font-weight:700;color:#fff;padding-bottom:8px;border-bottom:2px solid #E8B84B;letter-spacing:-.02em}
.tabs{display:flex;gap:5px}
.tab{flex:1;padding:9px 4px;background:#2a2a2a;border:none;color:#888;font-size:13px;cursor:pointer;border-radius:7px;transition:all .15s;font-weight:600}
.tab.active{background:#E8B84B;color:#000}
label{display:block;font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;font-weight:600}
textarea,input[type=text]{width:100%;background:#141414;border:1px solid #333;border-radius:7px;color:#eee;padding:9px 12px;font-size:16px;font-family:inherit;resize:vertical;line-height:1.4}
textarea{min-height:80px}
textarea:focus,input:focus{outline:none;border-color:#E8B84B}
.field{display:flex;flex-direction:column;gap:4px}
.field.hidden{display:none}
.row{display:flex;gap:8px}
.row .field{flex:1}
.btn-dl{width:100%;padding:13px;background:#E8B84B;color:#000;font-weight:700;font-size:15px;border:none;border-radius:8px;cursor:pointer;transition:opacity .15s;letter-spacing:-.01em}
.btn-dl:hover{opacity:.85}
canvas{border-radius:10px;box-shadow:0 8px 48px rgba(0,0,0,.7)}
.sublabel{font-size:11px;color:#555;text-align:center}
.desc{font-size:12px;color:#5a5a5a;line-height:1.45;padding:8px 10px;background:#181818;border-radius:6px;border-left:2px solid #E8B84B}
@media(max-width:700px){
body{flex-direction:column;height:auto;overflow-y:auto;overflow-x:hidden}
.sidebar{width:100%;min-width:0;border-right:none;border-bottom:1px solid #2e2e2e}
.preview-area{padding:16px}
}
.edit-badge{display:none;font-size:11px;color:#E8B84B;font-weight:700;letter-spacing:.03em}
.reset-btn{background:none;border:none;color:#666;font-size:11px;cursor:pointer;padding:0 0 0 5px;text-decoration:underline}
.nav-meta{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-sticky{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1e1e1e;padding:10px 0 4px;border-top:1px solid #2e2e2e;margin-top:4px}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-btn{flex:0 0 36px;height:36px;background:#2a2a2a;border:none;color:#E8B84B;font-size:20px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.nav-btn:hover{background:#3a3a3a}
.nav-counter{flex:1;text-align:center;font-size:12px;color:#888;font-weight:600}
</style>

let TESTIMONIALS = [];
let testiIdx = -1;

function loadTestimonial(idx) {
  if (idx < 0 || idx >= TESTIMONIALS.length) return;
  testiIdx = idx;
  const t = TESTIMONIALS[idx];
  document.getElementById('quote').value = t.card_quote || t.quote;
  document.getElementById('name').value = t.name;
  document.getElementById('industry').value = t.industry;
  document.getElementById('zip').value = t.zip;
  document.getElementById('testi-counter').textContent = (idx+1) + ' / ' + TESTIMONIALS.length;
  let _saved; try{_saved=JSON.parse(localStorage.getItem(EDIT_KEY(idx)));}catch(e){}
  if(_saved){
    if(_saved.quote)document.getElementById('quote').value=_saved.quote;
    if(_saved.name)document.getElementById('name').value=_saved.name;
    if(_saved.industry!==undefined)document.getElementById('industry').value=_saved.industry;
    if(_saved.zip!==undefined)document.getElementById('zip').value=_saved.zip;
    const bc=document.getElementById('bold-close');if(bc&&_saved.boldClose!==undefined)bc.value=_saved.boldClose;
    const hl=document.getElementById('headline');if(hl&&_saved.headline!==undefined)hl.value=_saved.headline;
  }
  checkEdited();
  // Bold-close: clear it when loading from testimonials (no curated bold-close available)
  const bc = document.getElementById('bold-close');
  if (bc) bc.value = '';
  render();
}

function fitFont(basePx, minPx, text, maxW) {
  let px = basePx;
  while (px > minPx) {
    const lines = wrapLines(`500 ${px}px Montserrat,sans-serif`, text, maxW);
    if (lines.length <= Math.floor(700 / (px * 1.45))) return {px, lines};
    px -= 2;
  }
  return {px: minPx, lines: wrapLines(`500 ${minPx}px Montserrat,sans-serif`, text, maxW)};
}

  const s=Math.min(mw/W,mh/H,1);
  canvas.style.width=(W*s)+'px'; canvas.style.height=(H*s)+'px';
}

// render triggered after fonts ready (see bottom)

function wrapLines(font,text,maxW){
  ctx.font=font;
  if(!text||!text.trim()) return [];
  const words=text.trim().split(/\s+/);
  const lines=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}
    else line=t;
  }
  if(line) lines.push(line);
  return lines;
}

function drawLines(lines,x,y,lh){
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));
  return lines.length*lh;
}

function liftLogo(x,y,sz=1){
  const fs=32*sz, px=24*sz, py=12*sz;
  const f=`bold ${fs}px Montserrat,sans-serif`;
  ctx.font=f;
  const lw=ctx.measureText('LIFT').width;
  const pw=ctx.measureText(' Philly').width;
  const bw=lw+pw+px*2, bh=fs+py*2;
  ctx.fillStyle='#000';
  pill(x,y,bw,bh,bh/2); ctx.fill();
  ctx.fillStyle=WHITE; ctx.textBaseline='middle';
  ctx.fillText('LIFT',x+px,y+bh/2);
  ctx.fillStyle=GOLDBRIGHT;
  ctx.fillText(' Philly',x+px+lw,y+bh/2);
  ctx.textBaseline='alphabetic';
  return bh;
}

function pill(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function drawBg(overlay){
  const ia=bg.width/bg.height, ca=W/H;
  let sx=0,sy=0,sw=bg.width,sh=bg.height;
  if(ia>ca){sw=bg.height*ca;sx=(bg.width-sw)/2;}
  else{sh=bg.width/ca;sy=(bg.height-sh)/2;}
  ctx.drawImage(bg,sx,sy,sw,sh,0,0,W,H);
  ctx.fillStyle=overlay; ctx.fillRect(0,0,W,H);
}

function swipeHint(color){
  const c=color||'#ffffff';
  ctx.font='500 25px Montserrat,sans-serif';
  ctx.fillStyle=c;
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  const cx=890;
  ctx.fillText('Swipe for',cx,1192);
  ctx.fillText('more stories',cx,1228);
  // thick arrow
  const ay=1278, x1=828, x2=938;
  ctx.strokeStyle=c; ctx.fillStyle=c; ctx.lineWidth=10; ctx.lineCap='butt';
  ctx.beginPath(); ctx.moveTo(x1,ay); ctx.lineTo(x2,ay); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2-4,ay-22); ctx.lineTo(x2+30,ay); ctx.lineTo(x2-4,ay+22);
  ctx.closePath(); ctx.fill();
  ctx.textAlign='left';
}

function wrapRichLines(parts,maxW){
  const words=[];
  for(const p of parts){
    if(!p.text||!p.text.trim()) continue;
    for(const w of p.text.trim().split(/\s+/)) words.push({w,font:p.font});
  }
  const lines=[]; let cur=[], curW=0;
  for(const t of words){
    ctx.font=t.font;
    const ww=ctx.measureText(t.w).width;
    const sw=cur.length?ctx.measureText(' ').width:0;
    if(cur.length&&curW+sw+ww>maxW){lines.push(cur);cur=[t];curW=ww;}
    else{cur.push(t);curW+=sw+ww;}
  }
  if(cur.length) lines.push(cur);
  return lines;
}

function drawRichLines(lines,x,y,lh){
  lines.forEach((line,i)=>{
    let cx=x;
    line.forEach((t,j)=>{
      ctx.font=t.font;
      const txt=(j?' ':'')+t.w;
      ctx.fillText(txt,cx,y+i*lh);
      cx+=ctx.measureText(txt).width;
    });
  });
  return lines.length*lh;
}

function toTitle(s){return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();}
function truncateToFit(text,fontStr,maxW,maxLines){
  const words=text.split(' ');
  let end=words.length;
  while(end>1){
    const t=words.slice(0,end).join(' ')+(end<words.length?'…':'');
    if(wrapLines(fontStr,t,maxW).length<=maxLines) return t;
    end--;
  }
  return words[0]+'…';
}
function formatName(n){
  const parts=n.trim().split(/\s+/);
  if(parts.length===1) return toTitle(parts[0]);
  const isTitle=/^(Dr|Mr|Ms|Mrs|Prof)\.$/i.test(parts[0]);
  const first=isTitle?parts[0]+' '+toTitle(parts[1]):toTitle(parts[0]);
  const last=parts[parts.length-1];
  return first+' '+last.charAt(0).toUpperCase()+'.';
}
function renderA(d){
  drawBg('rgba(255,255,255,0)');
  const P=95,TW=W-P*2;

  // Header text (no band, no divider — matches reference)
  ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.fillStyle='#111827';
  ctx.font=`bold 44px Montserrat,sans-serif`;
  ctx.fillText('CITY COUNCIL',W/2,148);
  ctx.font=`bold 38px Montserrat,sans-serif`;
  ctx.fillText('Constituent Testimonies - Bill 251026',W/2,214);

  // Measure body first so we can size the box
  let y=468;
  const AVAIL_H=672; // 1140-468
  let qPx=56;
  let bodyLines,bcLines=[];
  while(qPx>=30){
    bodyLines=wrapLines(`700 ${qPx}px Montserrat,sans-serif`,(d.card_quote||d.quote),TW);
    const lh=qPx*1.45;
    let needed=bodyLines.length*lh;
    if(d.boldClose&&d.boldClose.trim()){
      bcLines=wrapLines(`bold ${qPx}px Montserrat,sans-serif`,d.boldClose,TW);
      needed+=56+bcLines.length*lh;
    }
    if(needed<=AVAIL_H) break;
    qPx-=2;
  }
  // truncate if still overflows at floor
  {const maxL=Math.floor(AVAIL_H/(qPx*1.45)); if(bodyLines.length>maxL){const tq=truncateToFit((d.card_quote||d.quote),`700 ${qPx}px Montserrat,sans-serif`,TW,maxL); bodyLines=wrapLines(`700 ${qPx}px Montserrat,sans-serif`,tq,TW);}}
  const lh=qPx*1.45;
  const quoteContentH=bodyLines.length*lh+((d.boldClose&&d.boldClose.trim())?56+bcLines.length*lh:0);

  // Rounded box tight around just the quote (mark + body + bold close)
  const boxX=P-40,boxY=300,boxW=TW+80,boxH=168+quoteContentH+30,boxR=20;
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.beginPath();
  ctx.moveTo(boxX+boxR,boxY);
  ctx.lineTo(boxX+boxW-boxR,boxY);
  ctx.arcTo(boxX+boxW,boxY,boxX+boxW,boxY+boxR,boxR);
  ctx.lineTo(boxX+boxW,boxY+boxH-boxR);
  ctx.arcTo(boxX+boxW,boxY+boxH,boxX+boxW-boxR,boxY+boxH,boxR);
  ctx.lineTo(boxX+boxR,boxY+boxH);
  ctx.arcTo(boxX,boxY+boxH,boxX,boxY+boxH-boxR,boxR);
  ctx.lineTo(boxX,boxY+boxR);
  ctx.arcTo(boxX,boxY,boxX+boxR,boxY,boxR);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Quote mark — centered
  ctx.font=`bold 150px “Playfair Display”,serif`; ctx.fillStyle='#111827';
  ctx.fillText('”',W/2,390);

  // Body quote
  const bodyF=`700 ${qPx}px Montserrat,sans-serif`;
  ctx.fillStyle='#1f2937'; ctx.textAlign='left';
  ctx.font=bodyF;
  y+=drawLines(bodyLines,P,y,lh);

  // Bold close
  if(d.boldClose&&d.boldClose.trim()){
    y+=56;
    const bcF=`bold ${qPx}px Montserrat,sans-serif`;
    if(!bcLines.length) bcLines=wrapLines(bcF,d.boldClose,TW);
    ctx.font=bcF; ctx.fillStyle='#111827';
    y+=drawLines(bcLines,P,y,lh);
  }

  // Attribution — anchored near bottom
  // Pre-calculate logo width so we can constrain attribution text
  ctx.font=`bold 48px Montserrat,sans-serif`;
  const lw2=ctx.measureText('LIFT').width+ctx.measureText(' Philly').width+72;
  const logoLeft=W-90-lw2;
  const attrMaxW=logoLeft-P-24;

  const nFA=1+(d.industry&&d.industry.trim()?1:0)+(d.zip&&d.zip.trim()?1:0);
  y=1300-(nFA-1)*45;
  ctx.fillStyle='#111827';
  ctx.font=`bold 34px Montserrat,sans-serif`;
  ctx.fillText(formatName(d.name),P,y,attrMaxW);
  ctx.font=`500 31px Montserrat,sans-serif`;
  let ay=y;
  if(d.industry&&d.industry.trim()){ay+=45;ctx.fillText(d.industry,P,ay,attrMaxW);}
  if(d.zip&&d.zip.trim()){ay+=45;ctx.fillText(d.zip,P,ay,attrMaxW);}

  // LIFT logo bottom right
  liftLogo(logoLeft,1216,1.5);
}

    if(lines.length*(qPx*1.45)<=644) break;
    qPx-=2;
  }
  // truncate if still overflows at floor
  {const maxL=Math.floor(644/(qPx*1.45)); if(lines.length>maxL){const tq=truncateToFit((d.card_quote||d.quote),`500 ${qPx}px Montserrat,sans-serif`,TW,maxL); lines=wrapRichLines([{text:tq,font:`bold ${qPx}px Montserrat,sans-serif`}],TW);}}
  const bF=`bold ${qPx}px Montserrat,sans-serif`;
  const rF=`700 ${qPx}px Montserrat,sans-serif`;
  y+=drawRichLines(lines,P,y,qPx*1.45);

  // Attribution
  const nFB=1+(d.industry&&d.industry.trim()?1:0)+(d.zip&&d.zip.trim()?1:0);
  y=1300-(nFB-1)*59; ctx.fillStyle='#111827';

  if(d.zip&&d.zip.trim()){ay+=59;ctx.fillText(d.zip,P,ay);}

  swipeHint('#111827');
}

  liftLogo(P,80,1.5);

  // “Constituent Testimonies / Bill 251026” — right-aligned beside the pill
  const logoMidY=80+(32*1.5+12*1.5*2)/2;
  ctx.textAlign='right'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.font=`500 24px Montserrat,sans-serif`;
  ctx.fillText('Constituent Testimonies',W-P,logoMidY-15);
  ctx.fillText('Bill 251026',W-P,logoMidY+15);
  ctx.textBaseline='alphabetic';

  // White headline — left aligned
  let y=313; ctx.textAlign='left'; ctx.fillStyle=WHITE;
  ctx.letterSpacing='1px';
  const hF=`bold 52px Montserrat,sans-serif`;
  const hL=wrapLines(hF,d.headline.toUpperCase(),TW);
  ctx.font=hF;
  hL.forEach((l,i)=>ctx.fillText(l,P,y+i*85));
  y+=hL.length*85;
  ctx.letterSpacing='0px';

  // Gold quote mark — left aligned
  y=Math.max(y+50,575);
  ctx.font=`bold 150px “Playfair Display”,serif`; ctx.fillStyle=CGOLD;
  ctx.fillText('”',P,y);

  // Gold quote — bold sans, left aligned, auto-scale, no letter-spacing
  y+=36;
  let qPxC=72,qL;
  while(qPxC>=30){
    qL=wrapLines(`bold ${qPxC}px Montserrat,sans-serif`,(d.card_quote||d.quote),TW);
    if(qL.length*(qPxC*1.5)<=(1200-y)) break;
    qPxC-=2;
  }
  const qLH=qPxC*1.5;
  ctx.font=`bold ${qPxC}px Montserrat,sans-serif`; ctx.fillStyle=GOLDBRIGHT;
  qL.forEach((l,i)=>ctx.fillText(l,P,y+i*qLH));
  // Attribution white — bottom left, anchored at 1300
  const nFC=1+(d.industry&&d.industry.trim()?1:0)+(d.zip&&d.zip.trim()?1:0);
  let ay=1300-(nFC-1)*48;
  ctx.textAlign='left'; ctx.fillStyle=WHITE;
  ctx.font=`bold 36px Montserrat,sans-serif`;
  ctx.fillText(formatName(d.name),P,ay);
  ctx.font=`500 33px Montserrat,sans-serif`;
  if(d.industry&&d.industry.trim()){ay+=48;ctx.fillText(d.industry,P,ay);}
  if(d.zip&&d.zip.trim()){ay+=48;ctx.fillText(d.zip,P,ay);}

  swipeHint('#ffffff');
}

function render(){
  if(!bg.complete||!bg.naturalWidth) return;
  ctx.clearRect(0,0,W,H);
  const d={
    quote:document.getElementById('quote').value,
    boldClose:document.getElementById('bold-close').value,
    headline:document.getElementById('headline').value,
    name:document.getElementById('name').value,
    industry:document.getElementById('industry').value,
    zip:document.getElementById('zip').value
  };
  if(tpl==='A') renderA(d);
  else if(tpl==='B') renderB(d);
  else renderC(d);
}

// Tab switching
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    tpl=btn.dataset.tpl;
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const T=TEMPLATES[tpl];
    document.getElementById('tpl-desc').textContent=T.desc;
    document.getElementById('field-headline').classList.toggle('hidden',!T.showHeadline);
    document.getElementById('field-bold-close').classList.toggle('hidden',!T.showBoldClose);
    document.getElementById('quote').value=T.q;
    document.getElementById('bold-close').value=T.bc;
    document.getElementById('name').value=T.name;
    document.getElementById('industry').value=T.industry;
    document.getElementById('zip').value=T.zip;
    render();
  });
});

['quote','bold-close','headline','name','industry','zip'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>{render();saveEdit();});
});

const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
if(isIOS) document.getElementById('btn-dl').textContent='Open Image to Save';
document.getElementById('btn-dl').addEventListener('click',()=>{
  const url=canvas.toDataURL('image/png');
  if(isIOS){
    let ov=document.getElementById('ios-save-ov');
    if(!ov){
      ov=document.createElement('div');
      ov.id='ios-save-ov';
      ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:20px;box-sizing:border-box;';
      ov.innerHTML='<p style="color:#fff;margin:0 0 14px;font-size:15px;text-align:center;line-height:1.4;">Long-press the image below,<br>then tap <strong>Save to Photos</strong></p><img id="ios-save-img" style="max-width:100%;max-height:65vh;border-radius:8px;"><button id="ios-save-close" style="margin-top:16px;padding:12px 28px;background:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;">Done</button>';
      document.body.appendChild(ov);
      document.getElementById('ios-save-close').addEventListener('click',()=>{ov.style.display='none';});
    }

    ov.style.display='flex';
  }
  else{const a=document.createElement('a');a.download=`lift-card-${tpl.toLowerCase()}-${Date.now()}.png`;a.href=url;a.click();}
});



const EDIT_KEY=idx=>`lift_edit_${idx}`;
function getFields(){
  return{quote:document.getElementById('quote').value,name:document.getElementById('name').value,
  industry:document.getElementById('industry').value,zip:document.getElementById('zip').value,
  boldClose:(document.getElementById('bold-close')||{value:''}).value,
  headline:(document.getElementById('headline')||{value:''}).value};
}
function checkEdited(){
  const b=document.getElementById('edit-badge');
  if(!b) return;
  let s; try{s=localStorage.getItem(EDIT_KEY(testiIdx));}catch(e){}
  b.style.display=s?'inline':'none';
}
function saveEdit(){
  if(testiIdx<0) return;
  const f=getFields(),t=TESTIMONIALS[testiIdx];
  const changed=f.quote!==t.quote||f.name!==t.name||f.industry!==t.industry||f.zip!==t.zip;
  try{changed?localStorage.setItem(EDIT_KEY(testiIdx),JSON.stringify(f)):localStorage.removeItem(EDIT_KEY(testiIdx));}catch(e){}
  checkEdited();
}
document.getElementById('btn-prev').addEventListener('click',()=>{
  loadTestimonial(testiIdx <= 0 ? TESTIMONIALS.length-1 : testiIdx-1);
});

document.getElementById('btn-reset').addEventListener('click',()=>{
  if(testiIdx<0) return;
  try{localStorage.removeItem(EDIT_KEY(testiIdx));}catch(e){}
  loadTestimonial(testiIdx);
});
document.getElementById('btn-next').addEventListener('click',()=>{
  loadTestimonial(testiIdx < 0 ? 0 : (testiIdx+1) % TESTIMONIALS.length);
});
// Load first testimonial on startup
fetch('/lift-testimonials.json')
  .then(r=>r.json())
  .then(data=>{
    TESTIMONIALS=data;
    document.getElementById('testi-counter').textContent='1 / '+data.length;
    document.fonts.ready.then(()=>loadTestimonial(0));
  })
  .catch(()=>{ document.fonts.ready.then(()=>render()); });

document.fonts.ready.then(()=>{
  if(bg.complete&&bg.naturalWidth) render();
  else bg.onload=render;
});
</script>
