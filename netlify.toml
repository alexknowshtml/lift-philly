[build]
  publish = "."
  command = "node scripts/build-nav.js && git submodule update --init --recursive && cd coalition-tracker && npm install"

[functions]
  directory = "coalition-tracker/netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/action/embed/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

# Strip trailing slashes from admin/api paths before function routing
[[redirects]]
  from = "/admin/"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/admin/*/"
  to = "/admin/:splat"
  status = 301
  force = true

# Route all tracker UI and API paths to the Netlify Function
# Static files (petition/index.html, etc.) take priority automatically
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
  force = false
